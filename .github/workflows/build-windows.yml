name: Build Windows App

on:
  push:
    branches: [ main, master ]
    # 只有 Windows 相关文件变动才触发；安卓代码变动不触发本流水线
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

# 同一分支连续推送时取消上一次未跑完的任务，避免排队堆积
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows/YzuNet.Windows/YzuNet.Windows.csproj

      - name: Build
        run: dotnet build windows/YzuNet.Windows/YzuNet.Windows.csproj -c Release --no-restore

      - name: Publish self-contained single file
        run: >
          dotnet publish windows/YzuNet.Windows/YzuNet.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: yzu-net-windows
          path: publish/*.exe
          if-no-files-found: error
